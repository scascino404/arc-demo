[project]
name = "arc-demo"
version = "0.1.0"
description = "RL quadruped locomotion over rough terrain on a small C89 physics engine"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "gymnasium>=1.0",
    "stable-baselines3>=2.4",
    "torch>=2.5",
    "tensorboard>=2.18",
    "pillow>=11.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arc"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
